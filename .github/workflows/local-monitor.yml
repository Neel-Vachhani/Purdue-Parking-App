name: BoilerPark VM CI/CD
on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - 'BoilerPark-LandingPage/**'
  workflow_dispatch:

jobs:
  sync-and-execute:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            backend:
              - Backend/**
            frontend:
              - BoilerPark-LandingPage/**

      - name: Sync and Run Backend
        if: steps.changed-files.outputs.backend_any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Syncing Backend..."
          cd /home/neelvachhani/Purdue-Parking-App
          git pull origin main
          sudo systemctl restart django-app.service
          sudo systemctl restart daphne.service

      - name: Sync and Run Frontend
        if: steps.changed-files.outputs.frontend_any_changed == 'true' || github.event_name == 'workflow_dispatch'
        # Added these so your build doesn't crash
        env:
          API_BASE_URL_DEV: "http://localhost:5000"
          API_BASE_URL_PROD: "https://api.boilerpark.com"
        run: |
          echo "Syncing Frontend..."
          cd /home/neelvachhani/Purdue-Parking-App
          git pull origin main
          cd /home/neelvachhani/Purdue-Parking-App/BoilerPark-LandingPage
          npm ci --no-audit --no-fund
          npm run build
          sudo rm -rf /var/www/boilerpark/*
          sudo mv dist/* /var/www/boilerpark/
